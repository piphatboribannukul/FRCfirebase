<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>FRC Mobile (ทดสอบ)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ทดสอบดีไซน์หน้าจอมือถือ (แนว iOS / Expo) — ใช้ข้อมูล snapshot จาก data/stations.js ไม่ได้ต่อ Firebase -->
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(118,118,128,.12); --tint:#007aff; --bar:rgba(249,249,249,.94);
  --ok:#34c759; --warn:#ff9500; --bad:#ff3b30; --high:#5856d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --tint:#0a84ff; --bar:rgba(22,22,22,.94);
    --ok:#30d158; --warn:#ff9f0a; --bad:#ff453a; --high:#5e5ce6;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#d9dce1;font-family:-apple-system,"SF Pro Text","Sarabun",system-ui,sans-serif;color:var(--label);
  display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme: dark){ body{background:#111} }

/* เครื่องจำลอง: บนจอใหญ่แสดงเป็นกรอบมือถือ บนมือถือเต็มจอ */
.device{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 11px #1d1d1f,0 0 0 13px #3a3a3c,0 30px 80px rgba(0,0,0,.35)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:30}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;
  padding:6px 34px 0;font-weight:600;font-size:16px;z-index:20;pointer-events:none}
@media (max-width:500px){ body{display:block} .device{width:100%;height:100%;border-radius:0;box-shadow:none} .island,.statusbar{display:none} }

.scroll{position:absolute;inset:0;overflow-y:auto;padding:54px 0 100px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:500px){ .scroll{padding-top:env(safe-area-inset-top,20px)} }

/* nav bar แบบย่อ — ขึ้นเมื่อเลื่อนผ่าน large title */
.navbar{position:absolute;top:0;left:0;right:0;height:98px;padding-top:54px;z-index:10;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:17px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:.5px solid var(--sep);opacity:0;pointer-events:none;transition:opacity .15s}
.navbar.show{opacity:1}
@media (max-width:500px){ .navbar{height:calc(44px + env(safe-area-inset-top,20px));padding-top:env(safe-area-inset-top,20px)} }

.head{padding:6px 16px 8px}
.head .sub{font-size:13px;color:var(--label2);font-weight:500;letter-spacing:.2px}
.head h1{font-size:34px;line-height:41px;font-weight:700;margin:2px 0 0;letter-spacing:.3px}

/* สรุปภาพรวม */
.hero{margin:8px 16px 0;background:var(--card);border-radius:16px;padding:16px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between}
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:17px;font-weight:600;color:var(--label2);margin-left:4px}
.hero .cap{font-size:13px;color:var(--label2);margin-top:6px}
.status-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:16px 0 10px;gap:2px}
.dist span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.legend div{font-size:12px;color:var(--label2)}
.legend b{display:block;font-size:17px;color:var(--label);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}

/* segmented control */
.seg{margin:20px 16px 0;background:var(--fill);border-radius:9px;padding:2px;display:flex;position:relative}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--label);padding:6px 0;border-radius:7px;cursor:pointer;position:relative;z-index:1}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .25s cubic-bezier(.3,.7,.4,1)}
@media (prefers-color-scheme: dark){ .seg .thumb{background:#636366} }
.seg button.on{font-weight:600}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 32px 6px;font-size:13px;color:var(--label2);text-transform:none}
.list{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;cursor:pointer;position:relative;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left}
.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:.5px solid var(--sep)}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:18px;height:18px}
.row .txt{flex:1;min-width:0}
.row .t1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--label2);margin-top:1px}
.val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.val small{display:block;font-size:11px;font-weight:500;color:var(--label2)}
.chev{color:var(--label3);flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--label2);font-size:15px}
.foot{margin:12px 32px 0;font-size:12px;color:var(--label2);line-height:1.5}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);display:flex;padding:7px 0 0;z-index:10}
@media (max-width:500px){ .tabbar{height:calc(49px + env(safe-area-inset-bottom,0px))} }
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:#999;border:0;background:none;font-family:inherit;cursor:pointer}
.tab.on{color:var(--tint)}
.tab svg{width:26px;height:26px}

/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.dim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:14px 14px 0 0;z-index:41;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding:8px 0 40px;max-height:88%;overflow-y:auto}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px}
.sheet-h h2{font-size:20px;font-weight:700;margin:0;line-height:1.3}
.closeb{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--label2);display:grid;place-items:center;cursor:pointer;flex:none}
.sheet .meta{padding:0 16px;font-size:13px;color:var(--label2)}
.gauge{margin:14px 16px 0;background:var(--card);border-radius:12px;padding:16px}
.gauge .big{font-size:52px}
.scale{position:relative;height:10px;border-radius:5px;margin:18px 0 6px;
  background:linear-gradient(90deg,var(--bad) 0 10%,var(--warn) 10% 15%,var(--ok) 15% 60%,var(--high) 60% 100%)}
.scale .pin{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--label);transform:translateX(-50%);box-shadow:0 0 0 2px var(--card)}
.ticks{position:relative;height:14px;font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.kv .row{cursor:default;min-height:44px}
.kv .row::before{left:16px!important}
.kv .k{flex:1;font-size:16px}
.kv .v{font-size:16px;color:var(--label2);text-align:right}

@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="device" id="dev">
  <div class="island"></div>
  <div class="statusbar"><span id="clock">9:41</span><span>●●● ▮</span></div>
  <div class="navbar" id="nav">คุณภาพน้ำ</div>

  <div class="scroll" id="scr">
    <div class="head">
      <div class="sub" id="today"></div>
      <h1>คุณภาพน้ำ</h1>
    </div>

    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="big" id="avg">–<small>mg/L</small></div>
          <div class="cap">FRC เฉลี่ยจุดตรวจวัดในเส้นท่อ</div>
        </div>
        <span class="status-chip" id="chip"></span>
      </div>
      <div class="dist" id="dist"></div>
      <div class="legend" id="leg"></div>
    </div>

    <div class="seg" id="seg">
      <div class="thumb" id="thumb"></div>
      <button data-f="all" class="on">ทั้งหมด</button>
      <button data-f="alert">ต้องดูแล</button>
      <button data-f="monitor">ในเส้นท่อ</button>
      <button data-f="source">ต้นทาง</button>
    </div>

    <div class="section-h"><span id="secTitle">สถานีทั้งหมด</span><span id="secCount"></span></div>
    <div class="list" id="list"></div>
    <p class="foot">เกณฑ์ FRC ปลายท่อ ≥ 0.2 mg/L · ข้อมูลชุดนี้เป็น snapshot สำรอง (data/stations.js) ไม่ใช่ค่าสดจาก Firebase — หน้านี้ทำไว้ทดสอบดีไซน์เท่านั้น</p>
  </div>

  <nav class="tabbar">
    <button class="tab on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-.3 0-.6.1-.8.4C9 5.8 5.5 10.4 5.5 14a6.5 6.5 0 0 0 13 0c0-3.6-3.5-8.2-5.7-11.1-.2-.3-.5-.4-.8-.4z"/></svg>ภาพรวม</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>แผนที่</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>แจ้งเตือน</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>ตั้งค่า</button>
  </nav>

  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script src="data/stations.js"></script>
<script>
const S = (typeof SENSORS_FALLBACK !== 'undefined' ? SENSORS_FALLBACK : []).filter(s => typeof s.frc === 'number');
const TYPE = { plant:'โรงงานผลิตน้ำ', pump:'สถานีสูบส่ง/สูบจ่าย', monitor:'จุดตรวจวัดในเส้นท่อ' };
const ICON = {
  plant:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20V10l5 3V10l5 3V6h3l1 7h4v7z"/></svg>',
  pump:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 5v7l4 3"/></svg>',
  monitor:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-.3 0-.5.1-.7.4C9.5 5.8 6.5 9.8 6.5 13a5.5 5.5 0 0 0 11 0c0-3.2-3-7.2-4.8-9.6-.2-.3-.4-.4-.7-.4z"/></svg>'
};
// ระดับเดียวกับ app.js: <0.2 ต่ำกว่าเกณฑ์ · 0.2–0.3 เฝ้าระวัง · 0.3–1.2 ผ่าน · ≥1.2 สูง
function level(v){
  if (v < 0.2) return { k:'bad',  name:'ต่ำกว่าเกณฑ์', c:'var(--bad)' };
  if (v < 0.3) return { k:'warn', name:'เฝ้าระวัง',     c:'var(--warn)' };
  if (v < 1.2) return { k:'ok',   name:'ผ่าน',         c:'var(--ok)' };
  return            { k:'high', name:'สูง',           c:'var(--high)' };
}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── หัวหน้า ──
const now = new Date();
$('today').textContent = now.toLocaleDateString('th-TH', { weekday:'long', day:'numeric', month:'long' }).toUpperCase();
$('clock').textContent = now.toLocaleTimeString('th-TH', { hour:'numeric', minute:'2-digit' });

// ── สรุป ── (เฉลี่ยเฉพาะจุดในเส้นท่อ เพราะต้นทางมี FRC สูงตามการเติมคลอรีน)
const mon = S.filter(s => s.type === 'monitor');
const avg = mon.reduce((a, s) => a + s.frc, 0) / (mon.length || 1);
$('avg').innerHTML = avg.toFixed(2) + '<small>mg/L</small>';
const cnt = { bad:0, warn:0, ok:0, high:0 };
S.forEach(s => cnt[level(s.frc).k]++);
const alertN = cnt.bad + cnt.warn;
const chip = $('chip');
chip.textContent = alertN ? `${alertN} จุดต้องดูแล` : 'ผ่านทุกจุด';
chip.style.cssText = alertN ? 'color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)'
                            : 'color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)';
const L = [['bad','ต่ำ'],['warn','เฝ้าระวัง'],['ok','ผ่าน'],['high','สูง']];
$('dist').innerHTML = L.filter(([k]) => cnt[k]).map(([k]) => `<span style="flex:${cnt[k]};background:var(--${k})"></span>`).join('');
$('leg').innerHTML = L.map(([k, n]) => `<div><b>${cnt[k]}</b><i style="background:var(--${k})"></i>${n}</div>`).join('');

// ── รายการ ──
let filter = 'all';
function render(){
  let rows = S.slice();
  if (filter === 'alert')   rows = rows.filter(s => s.frc < 0.3);
  if (filter === 'monitor') rows = rows.filter(s => s.type === 'monitor');
  if (filter === 'source')  rows = rows.filter(s => s.type !== 'monitor');
  rows.sort((a, b) => a.frc - b.frc);   // ค่าต่ำสุดขึ้นก่อน — สิ่งที่ต้องดูแลอยู่บนสุด
  const titles = { all:'สถานีทั้งหมด', alert:'ต่ำกว่า 0.3 mg/L', monitor:'จุดตรวจวัดในเส้นท่อ', source:'โรงงานและสถานีสูบ' };
  $('secTitle').textContent = titles[filter];
  $('secCount').textContent = rows.length + ' จุด';
  $('list').innerHTML = rows.length ? rows.map(s => {
    const lv = level(s.frc);
    return `<button class="row" data-id="${esc(s.id)}">
      <span class="ico" style="background:${lv.c}">${ICON[s.type] || ICON.monitor}</span>
      <span class="txt"><div class="t1">${esc(s.name)}</div><div class="t2">${esc(s.id)} · ${TYPE[s.type] || ''}</div></span>
      <span class="val" style="color:${lv.c}">${s.frc.toFixed(2)}<small>${lv.name}</small></span>
      <svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m1 1 6 6-6 6"/></svg>
    </button>`;
  }).join('') : '<div class="empty">ไม่มีจุดที่ต้องดูแล 🎉</div>';
}
render();

// segmented control
const segBtns = [...$('seg').querySelectorAll('button')];
function moveThumb(){
  const on = segBtns.find(b => b.dataset.f === filter);
  $('thumb').style.width = on.offsetWidth + 'px';
  $('thumb').style.transform = `translateX(${on.offsetLeft - 2}px)`;
}
segBtns.forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  segBtns.forEach(x => x.classList.toggle('on', x === b));
  moveThumb(); render();
});
requestAnimationFrame(moveThumb);
addEventListener('resize', moveThumb);

// large title → nav bar
$('scr').addEventListener('scroll', e => $('nav').classList.toggle('show', e.target.scrollTop > 44));

// ── sheet รายละเอียด ──
function openSheet(s){
  const lv = level(s.frc), pct = Math.min(100, s.frc / 2 * 100);
  $('sheet').innerHTML = `
    <div class="grab"></div>
    <div class="sheet-h"><h2>${esc(s.name)}</h2>
      <button class="closeb" id="x" aria-label="ปิด"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m1 1 10 10M11 1 1 11"/></svg></button></div>
    <div class="meta">${esc(s.id)} · ${TYPE[s.type] || ''}</div>
    <div class="gauge">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div class="big" style="color:${lv.c}">${s.frc.toFixed(2)}<small>mg/L</small></div>
        <span class="status-chip" style="color:${lv.c};background:color-mix(in srgb,${lv.c} 14%,transparent)">${lv.name}</span>
      </div>
      <div class="scale"><div class="pin" style="left:${pct}%"></div></div>
      <div class="ticks">${[0,0.2,0.5,1,1.5,2].map(t => `<span style="left:${t/2*100}%">${t.toFixed(t%1?1:0)}</span>`).join('')}</div>
    </div>
    <div class="section-h">ข้อมูลสถานี</div>
    <div class="list kv">
      <div class="row"><span class="k">รหัส</span><span class="v">${esc(s.id)}</span></div>
      <div class="row"><span class="k">ประเภท</span><span class="v">${TYPE[s.type] || '–'}</span></div>
      ${s.area ? `<div class="row"><span class="k">ต้นทาง</span><span class="v">${esc(s.area)}</span></div>` : ''}
      <div class="row"><span class="k">พิกัด</span><span class="v">${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</span></div>
    </div>
    <p class="foot">ค่าจาก snapshot สำรอง — แอปจริงจะดึงค่าสดและกราฟย้อนหลังจาก Firebase /live และ /history</p>`;
  $('dim').classList.add('show'); $('sheet').classList.add('show');
  $('x').onclick = closeSheet;
}
function closeSheet(){ $('dim').classList.remove('show'); $('sheet').classList.remove('show'); }
$('dim').onclick = closeSheet;
addEventListener('keydown', e => e.key === 'Escape' && closeSheet());
$('list').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r) return;
  openSheet(S.find(s => s.id === r.dataset.id));
});
</script>
</body>
</html>
