name: Prune Firebase history (keep 7 days)

on:
  schedule:
    - cron: '0 18 * * *'   # 01:00 เวลาไทย ทุกวัน
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete history entries older than 7 days
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          node << 'EOF'
          const DB_URL    = 'https://frc-contour-default-rtdb.asia-southeast1.firebasedatabase.app';
          const DB_SECRET = process.env.FIREBASE_DB_SECRET;
          const KEEP_DAYS = 7;
          const CUTOFF    = Date.now() - KEEP_DAYS * 24 * 60 * 60 * 1000;
          const BATCH     = 1000;   // ดึง/ลบทีละก้อนเล็กเสมอ — กัน response ใหญ่จนพัง

          const NET_CODES = ['ETIMEDOUT','ECONNRESET','ECONNREFUSED','EAI_AGAIN','UND_ERR_CONNECT_TIMEOUT','UND_ERR_SOCKET'];
          function isNetErr(e){
            const c = (e && e.cause && e.cause.code) || (e && e.code) || '';
            return NET_CODES.includes(c) || /fetch failed/i.test((e && e.message) || '');
          }
          async function fetchRetry(url, opts) {
            for (let a = 1; ; a++) {
              try { return await fetch(url, opts); }
              catch (e) {
                if (!isNetErr(e) || a >= 3) throw e;   // retry เฉพาะ network เท่านั้น
                console.warn(`    retry ${a}/3 (${(e.cause&&e.cause.code)||e.message}) รอ ${a*5} วิ...`);
                await new Promise(r => setTimeout(r, a * 5000));
              }
            }
          }
          async function getJson(url) {
            const r = await fetchRetry(url);
            if (!r.ok) { const t = await r.text(); throw new Error(`HTTP ${r.status}: ${t.slice(0,120)}`); }
            return r.json();
          }
          async function patchNulls(path, keys) {
            const body = {};
            for (const k of keys) body[k] = null;
            const r = await fetchRetry(`${DB_URL}/${path}.json?auth=${DB_SECRET}`, {
              method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
            if (!r.ok) throw new Error(`PATCH ${path} ${r.status}`);
          }

          // ลบ entries เก่าของสถานีเดียว แบบวนทีละ batch จนหมด
          async function pruneStation(st) {
            let del = 0, guard = 0;
            while (guard++ < 500) {   // เพดานกันวนไม่รู้จบ (500×1000 = 5 แสน/สถานี/รอบ)
              const q = `orderBy=%22ts%22&endAt=${CUTOFF}&limitToFirst=${BATCH}`;
              const j = await getJson(`${DB_URL}/history/${st}.json?${q}&auth=${DB_SECRET}`);
              const keys = j ? Object.keys(j) : [];
              if (!keys.length) break;
              await patchNulls(`history/${st}`, keys);
              del += keys.length;
              if (keys.length < BATCH) break;
            }
            return del;
          }

          (async () => {
            const top = await getJson(`${DB_URL}/history.json?shallow=true&auth=${DB_SECRET}`);
            const stations = top ? Object.keys(top) : [];
            console.log('stations:', stations.length, '| cutoff:', new Date(CUTOFF).toISOString());
            let totalDel = 0, failed = [];
            for (const st of stations) {
              try {
                const d = await pruneStation(st);
                totalDel += d;
                if (d) console.log(`  ${st}: deleted ${d}`);
              } catch (e) {
                failed.push(st);
                console.error(`  ✗ ${st}: ${String(e.message||e).slice(0,140)} — ข้ามไปสถานีถัดไป`);
              }
            }
            console.log(`DONE — deleted ${totalDel} entries | failed stations: ${failed.length ? failed.join(', ') : 'none'}`);
            if (failed.length > stations.length / 2) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
