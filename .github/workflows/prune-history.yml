name: Prune Firebase history (keep 7 days)

on:
  schedule:
    - cron: '0 18 * * *'   # 01:00 เวลาไทย ทุกวัน
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions (แนะนำรันครั้งแรกทันทีหลังวางไฟล์)

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete history entries older than 7 days
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          node << 'EOF'
          const DB_URL    = 'https://frc-contour-default-rtdb.asia-southeast1.firebasedatabase.app';
          const DB_SECRET = process.env.FIREBASE_DB_SECRET;
          const KEEP_DAYS = 7;
          const CUTOFF    = Date.now() - KEEP_DAYS * 24 * 60 * 60 * 1000;
          const CHUNK     = 4000;   // ลบทีละก้อน กัน request ใหญ่เกิน

          // shallow = ดึงเฉพาะ "ชื่อ key" ไม่ดึงข้อมูล → แทบไม่กินโควตาดาวน์โหลด
          async function shallowKeys(path) {
            const r = await fetch(`${DB_URL}/${path}.json?shallow=true&auth=${DB_SECRET}`);
            if (!r.ok) throw new Error(`GET ${path} ${r.status}`);
            const j = await r.json();
            return j ? Object.keys(j) : [];
          }
          // v2: entries ของ bot ใช้ push-ID (ไม่ใช่เลข ts) ต้อง query ตามค่า ts ข้างใน
          // ต้องมี ".indexOn": ["ts"] ใน rules ของ history/$stationCode ก่อน
          async function oldKeysByTs(path) {
            const q = `orderBy=%22ts%22&endAt=${CUTOFF}`;
            const r = await fetch(`${DB_URL}/${path}.json?${q}&auth=${DB_SECRET}`);
            if (!r.ok) {
              const t = await r.text();
              if (t.includes('index')) { console.warn(`  (ข้าม ${path}: ยังไม่ได้เพิ่ม .indexOn ts ใน rules)`); return null; }
              throw new Error(`QUERY ${path} ${r.status}`);
            }
            const j = await r.json();
            return j ? Object.keys(j) : [];
          }
          async function patchNulls(path, keys) {
            for (let i = 0; i < keys.length; i += CHUNK) {
              const body = {};
              for (const k of keys.slice(i, i + CHUNK)) body[k] = null;
              const r = await fetch(`${DB_URL}/${path}.json?auth=${DB_SECRET}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
              });
              if (!r.ok) throw new Error(`PATCH ${path} ${r.status}`);
            }
          }

          (async () => {
            const stations = await shallowKeys('history');
            console.log('stations in history:', stations.length,
                        '| cutoff:', new Date(CUTOFF).toISOString());
            let totalDel = 0, totalKeep = 0;
            for (const st of stations) {
              const tsKeys = await shallowKeys(`history/${st}`);
              // แบบที่ 1: key เป็นเลข timestamp (จาก poll.yml) — เทียบจากชื่อ key ตรง ๆ
              const oldNumeric = tsKeys.filter(k => !isNaN(Number(k)) && Number(k) < CUTOFF);
              // แบบที่ 2: key เป็น push-ID (จาก LINE bot) — query ด้วยค่า ts ข้างใน
              const oldByTs = await oldKeysByTs(`history/${st}`);
              const oldSet = new Set(oldNumeric);
              if (oldByTs) for (const k of oldByTs) oldSet.add(k);
              const old = [...oldSet];
              totalKeep += tsKeys.length - old.length;
              if (old.length) {
                await patchNulls(`history/${st}`, old);
                totalDel += old.length;
                console.log(`  ${st}: deleted ${old.length} (numeric ${oldNumeric.length}), kept ${tsKeys.length - old.length}`);
              }
            }
            console.log(`DONE — deleted ${totalDel} entries, kept ${totalKeep} (last ${KEEP_DAYS} days)`);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
