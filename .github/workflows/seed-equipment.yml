name: Seed equipment registry (one-time)

on:
  workflow_dispatch:   # รันเองครั้งเดียวจากแท็บ Actions แล้วลบไฟล์นี้ทิ้งได้

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed sensors for 49 stations
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          node << 'EOF'
          const DB_URL='https://frc-contour-default-rtdb.asia-southeast1.firebasedatabase.app';
          const SEC=process.env.FIREBASE_DB_SECRET;
          const DATA={"stations": [{"id": "SW01"}, {"id": "SM02"}, {"id": "SW11"}, {"id": "SW02"}, {"id": "S008"}, {"id": "S009"}, {"id": "SW03"}, {"id": "S010"}, {"id": "SM03"}, {"id": "SW04"}, {"id": "S011"}, {"id": "S012"}, {"id": "S013"}, {"id": "SM04"}, {"id": "S014"}, {"id": "SW05"}, {"id": "S015"}, {"id": "SM05"}, {"id": "S016"}, {"id": "S017"}, {"id": "SW06"}, {"id": "S019"}, {"id": "S018"}, {"id": "S020"}, {"id": "SW07"}, {"id": "S021"}, {"id": "S022"}, {"id": "S023"}, {"id": "SM01"}, {"id": "S003"}, {"id": "S002"}, {"id": "S005"}, {"id": "S004"}, {"id": "SW08"}, {"id": "S026"}, {"id": "S025"}, {"id": "SW09"}, {"id": "S027"}, {"id": "S028"}, {"id": "SW10"}, {"id": "S024"}, {"id": "S029"}, {"id": "S032"}, {"id": "SM06"}, {"id": "S030"}, {"id": "S001"}, {"id": "S031"}, {"id": "S007"}, {"id": "S006"}], "krk": ["SW01", "SW02", "SW03", "SW04", "SW05", "SW06", "SW07", "SW08", "SW09", "SW10"]};
          const KRK=new Set(DATA.krk);
          const PARAMS=['คลอรีนอิสระคงเหลือ (FRC)','Turbidity','Conductivity','pH'];
          const slug=s=>s.replace(/[.#$\[\]\/\s]+/g,'_').replace(/_+$/,'');
          (async()=>{
            let made=0,skip=0;
            for(const st of DATA.stations){
              const brand=KRK.has(st.id)?'KRK':'Holiba TW-150';
              for(const pm of PARAMS){
                const pk=slug(pm);
                const r=await fetch(`${DB_URL}/equipment/${st.id}/${pk}.json?auth=${SEC}`);
                const cur=await r.json();
                const hasSensor=cur&&Object.values(cur).some(p=>p&&p.part==='Sensor');
                if(hasSensor){skip++;continue;}   // มีอยู่แล้ว ไม่ทับ
                const pid='p'+Date.now()+Math.floor(Math.random()*1000);
                const w=await fetch(`${DB_URL}/equipment/${st.id}/${pk}/${pid}.json?auth=${SEC}`,{
                  method:'PUT',headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({part:'Sensor',brand,start:'',lifeM:0,by:'seed 29/08/69',ts:Date.now()})});
                if(!w.ok)throw new Error(`PUT ${st.id}/${pk} ${w.status}: ${await w.text()}`);
                made++;
              }
            }
            console.log(`DONE — created ${made} sensors, skipped ${skip} (มีอยู่แล้ว)`);
          })().catch(e=>{console.error(e);process.exit(1);});
          EOF
