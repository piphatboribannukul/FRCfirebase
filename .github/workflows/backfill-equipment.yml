name: Backfill equipment dates + fix SW01 + reset log (one-time)

on:
  workflow_dispatch:   # รันครั้งเดียว แล้วลบไฟล์นี้ทิ้ง

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          node << 'EOF'
          const DB='https://frc-contour-default-rtdb.asia-southeast1.firebasedatabase.app';
          const SEC=process.env.FIREBASE_DB_SECRET;
          const D={"holiba": ["SM02", "SW11", "S008", "S009", "S010", "SM03", "S011", "S012", "S013", "SM04", "S014", "S015", "SM05", "S016", "S017", "S019", "S018", "S020", "S021", "S022", "S023", "SM01", "S003", "S002", "S005", "S004", "S026", "S025", "S027", "S028", "S024", "S029", "S032", "SM06", "S030", "S001", "S031", "S007", "S006"], "krk": ["SW01", "SW02", "SW03", "SW04", "SW05", "SW06", "SW07", "SW08", "SW09", "SW10"]};
          const slug=s=>s.replace(/[.#$\[\]\/\s]+/g,'_').replace(/_+$/,'');
          const PK_FRC=slug('คลอรีนอิสระคงเหลือ (FRC)'), PK_TUR=slug('Turbidity'), PK_CON=slug('Conductivity'), PK_PH=slug('pH');
          const LIFE={[PK_FRC]:36,[PK_TUR]:72,[PK_CON]:36,[PK_PH]:6};   // เดือน (FRC/Cond 36, Turb 72 ตามที่ตั้งไว้ที่ลุมพินี, pH 6)
          const START='2024-12-03';           // 03 ธ.ค. 2567
          const CHANGES=['2025-05-03','2025-11-03','2026-05-03'];   // พ.ค.68 / พ.ย.68 / พ.ค.69
          const CUR=CHANGES[CHANGES.length-1];
          const BY='backfill 29/08/69';
          async function get(p){const r=await fetch(`${DB}/${p}.json?auth=${SEC}`);if(!r.ok)throw new Error('GET '+p+' '+r.status);return r.json();}
          async function put(p,v){const r=await fetch(`${DB}/${p}.json?auth=${SEC}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok)throw new Error('PUT '+p+' '+r.status);}
          async function patch(p,v){const r=await fetch(`${DB}/${p}.json?auth=${SEC}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok)throw new Error('PATCH '+p+' '+r.status);}
          async function post(p,v){const r=await fetch(`${DB}/${p}.json?auth=${SEC}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok)throw new Error('POST '+p+' '+r.status);}
          async function del(p){await fetch(`${DB}/${p}.json?auth=${SEC}`,{method:'DELETE'});}

          (async()=>{
            // ── (ข้อ 5) reset ประวัติ log ทั้งหมด — เริ่มประวัติสะอาด ──
            await del('equipment_log');
            console.log('equipment_log cleared');

            // ── (ข้อ 2) SW01 ลุมพินี: ทุกชิ้นเป็น KRK ──
            const sw01=await get('equipment/SW01')||{};
            let fixed=0;
            for(const [pk,parts] of Object.entries(sw01)){
              for(const pid of Object.keys(parts||{})){
                await patch(`equipment/SW01/${pk}/${pid}`,{brand:'KRK',by:BY,ts:Date.now()});
                fixed++;
              }
            }
            console.log('SW01 -> KRK:',fixed,'parts');

            // ── (ข้อ 3) สถานี Holiba ทั้งหมด ──
            let sens=0,cart=0,logs=0;
            for(const sid of D.holiba){
              const cur=await get(`equipment/${sid}`)||{};
              // 3.1 Sensor ทุกพารามิเตอร์: start 03 ธ.ค.67 + อายุ | pH เริ่มตัวปัจจุบัน = เปลี่ยนครั้งล่าสุด
              for(const pk of [PK_FRC,PK_TUR,PK_CON,PK_PH]){
                const parts=cur[pk]||{};
                for(const [pid,p] of Object.entries(parts)){
                  if(!p||p.part!=='Sensor')continue;
                  const start=(pk===PK_PH)?CUR:START;
                  await patch(`equipment/${sid}/${pk}/${pid}`,{start,lifeM:LIFE[pk],by:BY,ts:Date.now()});
                  sens++;
                }
              }
              // 3.2 FRC Cartridge: สร้างถ้ายังไม่มี / อัปเดตถ้ามี — ตัวปัจจุบันเริ่มรอบล่าสุด อายุ 6 เดือน
              const frcParts=cur[PK_FRC]||{};
              const cartEntry=Object.entries(frcParts).find(([id,p])=>p&&p.part==='Cartridge');
              if(cartEntry){
                await patch(`equipment/${sid}/${PK_FRC}/${cartEntry[0]}`,{start:CUR,lifeM:6,by:BY,ts:Date.now()});
              }else{
                const pid='p'+Date.now()+Math.floor(Math.random()*1000);
                await put(`equipment/${sid}/${PK_FRC}/${pid}`,{part:'Cartridge',brand:'Holiba TW-150',start:CUR,lifeM:6,by:BY,ts:Date.now()});
              }
              cart++;
              // 3.3 ประวัติเปลี่ยน 3 ครั้ง: pH Sensor + FRC Cartridge
              for(const d of CHANGES){
                await post('equipment_log',{station:sid,param:PK_PH,part:'Sensor',brand:'Holiba TW-150',action:'เปลี่ยนอุปกรณ์',by:BY,date:d,detail:'บันทึกย้อนหลัง (auto)',ts:Date.now()});
                await post('equipment_log',{station:sid,param:PK_FRC,part:'Cartridge',brand:'Holiba TW-150',action:'เปลี่ยนอุปกรณ์',by:BY,date:d,detail:'บันทึกย้อนหลัง (auto)',ts:Date.now()});
                logs+=2;
              }
              console.log(' ',sid,'done');
            }
            console.log(`DONE — sensors updated ${sens}, cartridges ${cart}, log entries ${logs}`);
          })().catch(e=>{console.error(e);process.exit(1);});
          EOF
