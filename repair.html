<!DOCTYPE html>
<!-- repair.html — ระบบแจ้งซ่อมตู้วัดคุณภาพน้ำ (คู่กับ repair.js) -->
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แจ้งซ่อม — FRCContour</title>
<style>
:root{--nav:#1d2b4f;--line:#dde3ec;--accent:#2563eb;--good:#177a3d;--bad:#b3261e;--warn:#9a6a00;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,'Leelawadee UI',sans-serif;}
body{background:#f2f5fa;color:#1f2733;font-size:14px;}
.top{background:var(--nav);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;}
.top h1{font-size:17px;font-weight:600;flex:1;}
.top a{color:#c8d4ee;text-decoration:none;font-size:13px;}
.tabs{display:flex;gap:6px;padding:12px 20px 0;}
.tabbtn{border:1px solid var(--line);background:#fff;border-radius:9px 9px 0 0;padding:9px 18px;cursor:pointer;font-size:14px;}
.tabbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
.wrap{padding:14px 20px 40px;max-width:1200px;}
.card{background:#fff;border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(20,30,70,.05);}
label{font-size:12.5px;color:#556;display:block;margin:0 0 3px;}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;}
.grid{display:grid;gap:12px;}
.g3{grid-template-columns:2fr 1fr 1fr;}
.g4{grid-template-columns:1.4fr 1.4fr 1fr auto;}
.btn{border:0;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;background:#eef1f6;}
.btn.primary{background:var(--accent);color:#fff;font-weight:600;}
.btn.sm{padding:5px 10px;font-size:12.5px;}
.itemrow{display:grid;grid-template-columns:1.4fr 1.4fr 1fr auto;gap:10px;margin-bottom:8px;align-items:end;}
#rp-result{margin-top:12px;font-size:14px;line-height:1.7;display:none;border-radius:9px;padding:11px 14px;}
#rp-result.ok{display:block;background:#e6f6ea;color:#14532d;}
#rp-result.err{display:block;background:#fde3e0;color:#7f1d1d;}
.eq-tb{border-collapse:collapse;width:100%;font-size:13px;}
.eq-tb th{font-size:12.5px;font-weight:700;color:#3d4c66;text-align:left;padding:7px 10px;background:#eaf0f8;border-bottom:2px solid #d9e2ef;position:sticky;top:0;}
.eq-tb td{padding:6px 10px;border-bottom:1px solid #f0f2f6;vertical-align:top;}
.eq-tb tr:hover td{background:#f9fbff;}
.fbar{display:grid;grid-template-columns:110px 130px 1.6fr 1.3fr 1.2fr auto auto;gap:10px;margin-bottom:12px;align-items:end;}
.chip{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:700;}
.chip.open{background:#fff3d6;color:#9a6a00;}
.chip.closed{background:#e6f6ea;color:#177a3d;}
.muted{color:#889;font-size:12px;}
@media(max-width:820px){.g3,.g4,.itemrow,.fbar{grid-template-columns:1fr;}.card{overflow-x:auto;}.eq-tb{min-width:760px;}}
</style>
</head>
<body>
<div class="top">
  <h1>📮 ระบบแจ้งซ่อมตู้วัดคุณภาพน้ำ</h1>
  <a href="dashboard.html">← กลับ Dashboard</a>
</div>
<div class="tabs">
  <button class="tabbtn active" id="tab-form" onclick="rpTab('form')">📝 แจ้งซ่อม</button>
  <button class="tabbtn" id="tab-hist" onclick="rpTab('hist')">📜 ประวัติการแจ้งซ่อม</button>
</div>
<div class="wrap">

  <div id="pg-form">
    <div class="card">
      <div class="grid g3" style="margin-bottom:12px;">
        <div><label>สถานี / สถานที่</label>
          <select id="rp-station"></select>
          <input id="rp-station-other" placeholder="พิมพ์ชื่อสถานที่..." style="display:none;margin-top:6px;">
        </div>
        <div><label>วันที่พบปัญหา</label><input type="date" id="rp-fdate"></div>
        <div><label>เวลาที่พบ</label><input type="time" id="rp-ftime"></div>
      </div>
      <label style="margin-bottom:6px;">รายการปัญหา (1 สถานี = 1 ใบ แจ้งได้หลายพารามิเตอร์)</label>
      <div id="rp-items"></div>
      <button class="btn sm" onclick="rpAddItem()">➕ เพิ่มพารามิเตอร์</button>
      <div class="grid g3" style="margin-top:12px;">
        <div><label>ผู้ตรวจพบปัญหา / ผู้แจ้ง</label><input id="rp-reporter" placeholder="ชื่อ"></div>
        <div style="grid-column:span 2;align-self:end;">
          <button class="btn primary" id="rp-send" onclick="rpSubmit()">📨 ส่งใบแจ้งซ่อม (บันทึก + เมลถึงบริษัท)</button>
        </div>
      </div>
      <div id="rp-result"></div>
      <div class="muted" style="margin-top:8px;">กันซ้ำอัตโนมัติ: สถานีเดียวกันในวันเดียวกันจะรวมเป็นใบเดิม ไม่ส่งเมลซ้ำ · แจ้งผ่าน LINE ก็ได้: พิมพ์ "แจ้งซ่อม ชื่อสถานี อาการ" ในกลุ่ม</div>
    </div>
  </div>

  <div id="pg-hist" style="display:none;">
    <div class="card">
      <div class="fbar">
        <div><label>ปี (พ.ศ.)</label><select id="f-year"></select></div>
        <div><label>เดือน</label><select id="f-month"><option value="">ทั้งปี</option></select></div>
        <div><label>สถานี</label><select id="f-station"><option value="">ทุกสถานี</option></select></div>
        <div><label>พารามิเตอร์</label><select id="f-param"><option value="">ทั้งหมด</option></select></div>
        <div><label>ค้นหา</label><input id="f-q" placeholder="เลขใบ / คำในรายการ..." oninput="rpRender()"></div>
        <button class="btn" onclick="rpLoad()">🔄 โหลด</button>
        <button class="btn" onclick="rpExport()">⬇️ Export CSV</button>
      </div>
      <div id="h-stat" class="muted" style="margin-bottom:8px;"></div>
      <div style="max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:9px;">
        <table class="eq-tb"><thead><tr>
          <th style="width:110px">เลขที่ใบ</th><th style="width:95px">วันที่ออกใบ</th><th style="width:60px">เวลา</th>
          <th>สถานี</th><th>รายการปัญหา</th><th style="width:90px">ผู้แจ้ง</th><th style="width:70px">สถานะ</th>
        </tr></thead><tbody id="h-body"></tbody></table>
      </div>
    </div>
  </div>
</div>
<script src="repair.js"></script>
</body>
</html>
