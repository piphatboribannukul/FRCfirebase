<!DOCTYPE html>
<!-- repair.html — ระบบแจ้งซ่อมตู้วัดคุณภาพน้ำ · กองบูรณาการคุณภาพน้ำ กปน. (คู่กับ repair.js) -->
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แจ้งซ่อม — FRCContour</title>
<style>
:root{
  --navy:#101E3C; --navy2:#1A2C55; --ink:#1B2434; --mut:#5B6B83;
  --bg:#E9EEF6; --card:#FFFFFF; --line:#D5DEEB;
  --blue:#1E5EE0; --blue-soft:#E3ECFC; --teal:#0E8F8F;
  --ok-bg:#E1F4E7; --ok-ink:#136B36; --bad:#B3261E; --bad-bg:#FBE4E1;
  --chip:#EAF0FA; --chip-ink:#2A4A8F;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font:14px/1.55 'Segoe UI',Tahoma,'Leelawadee UI',sans-serif;min-height:100vh;}
/* ── header ── */
.hd{background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 78%,#22407E 100%);color:#fff;padding:0 26px;}
.hd-in{display:flex;align-items:center;gap:14px;height:62px;}
.hd .mark{width:36px;height:36px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-size:18px;}
.hd h1{font-size:17.5px;font-weight:700;letter-spacing:.2px;}
.hd .sub{font-size:11.5px;color:#9FB2D8;margin-top:1px;}
.hd .sp{flex:1;}
.hd a{color:#C9D7F2;text-decoration:none;font-size:13px;border:1px solid #33477A;border-radius:8px;padding:7px 13px;}
.hd a:hover{background:#22355F;}
/* ── tabs ── */
.tabs{display:flex;gap:2px;padding:0 26px;background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 100%);}
.tabbtn{border:0;background:transparent;color:#8FA3CC;padding:11px 20px 13px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;}
.tabbtn.active{color:#fff;font-weight:700;border-bottom-color:var(--blue);}
.wrap{padding:20px 26px 48px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 1px 3px rgba(16,30,60,.06);}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:0 0 4px;letter-spacing:.2px;}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;background:#FBFCFE;font-family:inherit;}
input:focus,select:focus{outline:2px solid var(--blue-soft);border-color:var(--blue);}
.btn{border:0;border-radius:9px;padding:9px 16px;font-size:13.5px;cursor:pointer;background:#EDF1F8;color:var(--ink);font-family:inherit;}
.btn:hover{background:#E2E9F4;}
.btn.primary{background:var(--blue);color:#fff;font-weight:700;padding:11px 22px;font-size:14.5px;}
.btn.primary:hover{background:#1750C4;}
.btn.sm{padding:5px 10px;font-size:12.5px;}
.btn.ghost-danger{background:transparent;color:var(--bad);}
.btn.ghost-danger:hover{background:var(--bad-bg);}
/* ── form ── */
.fgrid{display:grid;grid-template-columns:2.2fr 1fr 1fr 1.4fr;gap:14px;margin-bottom:16px;}
.items-hd{display:flex;align-items:center;gap:10px;margin:4px 0 8px;}
.items-hd b{font-size:13.5px;}
.items-hd span{font-size:12px;color:var(--mut);}
.itemrow{display:grid;grid-template-columns:1.5fr 1.3fr 1fr 40px;gap:12px;margin-bottom:9px;align-items:end;}
.sendbar{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);}
#rp-result{display:none;margin-top:14px;border-radius:11px;padding:14px 16px;font-size:14px;line-height:1.7;}
#rp-result.ok{display:block;background:var(--ok-bg);color:var(--ok-ink);border:1px solid #BFE5CC;}
#rp-result.err{display:block;background:var(--bad-bg);color:#7F1D1D;border:1px solid #F2C7C2;}
#rp-result .ticket{font-size:19px;font-weight:800;letter-spacing:.4px;font-variant-numeric:tabular-nums;}
/* ── history ── */
.kpis{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;min-width:118px;}
.kpi .n{font-size:21px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;}
.kpi .t{font-size:11.5px;color:var(--mut);}
.fbar{display:grid;grid-template-columns:105px 120px 1.5fr 1.3fr 1.4fr auto auto auto;gap:10px;margin-bottom:14px;align-items:end;}
.tbwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:66vh;background:var(--card);}
.rp-tb{border-collapse:collapse;width:100%;font-size:13.5px;}
.rp-tb th{position:sticky;top:0;background:var(--navy);color:#DCE6F8;font-size:12px;font-weight:700;text-align:left;padding:9px 12px;white-space:nowrap;z-index:1;}
.rp-tb td{padding:7px 12px;border-bottom:1px solid #EEF2F8;vertical-align:top;}
.rp-tb tr:hover td{background:#F6F9FE;}
.rp-tb .no{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap;}
.chip{font-size:11.5px;border-radius:7px;padding:2.5px 9px;font-weight:700;background:var(--chip);color:var(--chip-ink);white-space:nowrap;}
.chip.inh{background:#E7F5F1;color:#0B6B57;}
.muted{color:#8496AF;font-size:12px;}
.today-on{background:var(--blue)!important;color:#fff!important;font-weight:700;}
@media(max-width:900px){.fgrid,.itemrow,.fbar{grid-template-columns:1fr;}.wrap{padding:14px;}.hd,.tabs{padding-left:14px;padding-right:14px;}.rp-tb{min-width:900px;}}
</style>
</head>
<body>
<div class="hd"><div class="hd-in">
  <div class="mark">📮</div>
  <div><h1>ระบบแจ้งซ่อมตู้วัดคุณภาพน้ำ</h1><div class="sub">กองบูรณาการคุณภาพน้ำ · การประปานครหลวง</div></div>
  <div class="sp"></div>
  <a href="dashboard.html">← กลับ Dashboard</a>
</div></div>
<div class="tabs">
  <button class="tabbtn active" id="tab-form" onclick="rpTab('form')">📝 แจ้งซ่อม</button>
  <button class="tabbtn" id="tab-hist" onclick="rpTab('hist')">📜 ประวัติการแจ้งซ่อม</button>
</div>
<div class="wrap">

  <div id="pg-form">
    <div class="card">
      <div class="fgrid">
        <div><label>สถานี / สถานที่</label>
          <select id="rp-station"></select>
          <input id="rp-station-other" placeholder="พิมพ์ชื่อสถานที่..." style="display:none;margin-top:6px;">
        </div>
        <div><label>วันที่พบปัญหา</label><input type="date" id="rp-fdate"></div>
        <div><label>เวลาที่พบ</label><input type="time" id="rp-ftime"></div>
        <div><label>ผู้ตรวจพบปัญหา / ผู้แจ้ง</label><input id="rp-reporter" placeholder="ชื่อ-สกุล"></div>
      </div>
      <div class="items-hd"><b>รายการปัญหา</b><span>1 สถานี = 1 ใบ · แจ้งได้หลายพารามิเตอร์</span>
        <button class="btn sm" onclick="rpAddItem()">➕ เพิ่มพารามิเตอร์</button></div>
      <div id="rp-items"></div>
      <div class="sendbar">
        <button class="btn primary" id="rp-send" onclick="rpSubmit()">📨 ส่งใบแจ้งซ่อม</button>
        <span class="muted">บันทึกระบบ + Google Sheet + อีเมลผู้รับจ้าง (งาน 10 สจ. ของ กบน. ไม่ส่งเมล)</span>
      </div>
      <div id="rp-result"></div>
    </div>
  </div>

  <div id="pg-hist" style="display:none;">
    <div class="kpis" id="h-kpis"></div>
    <div class="card" style="padding:16px 18px;">
      <div class="fbar">
        <div><label>ปี (พ.ศ.)</label><select id="f-year"></select></div>
        <div><label>เดือน</label><select id="f-month"></select></div>
        <div><label>สถานี</label><select id="f-station"><option value="">ทุกสถานี</option></select></div>
        <div><label>รายการปัญหา</label><select id="f-param"><option value="">ทั้งหมด</option></select></div>
        <div><label>ค้นหา</label><input id="f-q" placeholder="เลขใบ / คำ / ผู้แจ้ง..." oninput="rpRender()"></div>
        <button class="btn" id="f-today" onclick="rpToday()">📅 วันนี้</button>
        <button class="btn" onclick="rpLoad(true)">🔄 โหลด</button>
        <button class="btn" onclick="rpExport()">⬇️ CSV</button>
      </div>
      <div id="h-stat" class="muted" style="margin-bottom:10px;"></div>
      <div class="tbwrap">
        <table class="rp-tb"><thead><tr>
          <th>เลขที่ใบ</th><th>วันที่ออกใบ</th><th>เวลา</th><th>สถานี</th>
          <th>รายการปัญหา</th><th>ความผิดปกติ</th><th>ผู้แจ้ง</th><th>ผู้รับจ้าง</th><th>สถานะ</th><th></th>
        </tr></thead><tbody id="h-body"></tbody></table>
      </div>
    </div>
  </div>
</div>
<script src="repair.js"></script>
</body>
</html>
