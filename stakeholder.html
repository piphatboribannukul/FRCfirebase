<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stakeholder Day · ชั้น 5 กปน.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<script>
  // three.js r160 (ES module, ฉบับย่อ) สำหรับฉากชั้น 5 · ?local = ใช้ไฟล์ในเครื่อง (ทดสอบแบบออฟไลน์)
  // modulepreload: ดึงไฟล์ทั้งหมดพร้อมกันตั้งแต่ต้น แทนการรอทีละชั้น (ชั้น 5 → addons → shader)
  (function () {
    var L = /[?&]local\b/.test(location.search);
    var B = L ? './node_modules/three/' : 'https://cdn.jsdelivr.net/npm/three@0.160.0/', J = B + 'examples/jsm/';
    var map = { imports: { three: B + 'build/three.module.min.js', 'three/addons/': J } };
    var pre = [B + 'build/three.module.min.js', './stakeholder_floor5.js'].concat(['controls/OrbitControls', 'environments/RoomEnvironment', 'postprocessing/EffectComposer', 'postprocessing/RenderPass',
      'postprocessing/GTAOPass', 'postprocessing/OutputPass', 'postprocessing/ShaderPass', 'postprocessing/MaskPass', 'postprocessing/Pass', 'geometries/RoundedBoxGeometry', 'utils/BufferGeometryUtils',
      'shaders/CopyShader', 'shaders/OutputShader', 'shaders/GTAOShader', 'shaders/PoissonDenoiseShader', 'math/SimplexNoise'].map(function (f) { return J + f + '.js'; }));
    document.write('<script type="importmap">' + JSON.stringify(map) + '<\/script>' +
      pre.map(function (u) { return '<link rel="modulepreload" href="' + u + '">'; }).join(''));
  })();
  window.SD3D_CONFIG = { cityBase: 'data/city/', autoInside: true };
</script>
<style>
  /* โทนแบบหน้าสินค้า: พื้นเทาอ่อน + ส่วนดำ, ตัวอักษรระบบ, ปุ่มแคปซูล · สีเด่นเดียว = น้ำเงินน้ำประปา · จุดเฉพาะ = เส้นทางผู้เข้าร่วม */
  :root {
    --bg:#f5f5f7; --ink:#1d1d1f; --sec:#6e6e73; --line:rgba(0,0,0,.08);
    --blue:#0a6fd8; --blue-d:#085fb9;
    --ease:cubic-bezier(.22,1,.36,1);
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","IBM Plex Sans Thai","Noto Sans Thai","Helvetica Neue",sans-serif;
  }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sys); -webkit-font-smoothing:antialiased; }
  #land { position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; background:var(--bg); transition:opacity .4s var(--ease); -webkit-overflow-scrolling:touch; }
  #land.off { opacity:0; pointer-events:none; }

  /* ── ส่วนบน (สว่าง) */
  .hero { min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; text-align:center; padding:max(72px,calc(env(safe-area-inset-top) + 48px)) 24px 0; }
  .hero > * { animation:rise .5s var(--ease) both; } .hero > .stage { animation-delay:.08s; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }
  .org { display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:500; color:var(--sec); }
  .org img { width:24px; height:24px; display:block; }
  h1 { margin:12px 0 0; font:600 80px/1.05 var(--sys); letter-spacing:-.015em; color:var(--ink); }
  .sub { margin:8px auto 0; font-size:28px; line-height:1.3; font-weight:400; color:var(--ink); max-width:36rem; }
  .acts { display:flex; gap:16px; justify-content:center; margin-top:28px; }
  .acts button { min-width:132px; height:48px; padding:0 24px; display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:24px; cursor:pointer;
    font:400 17px var(--sys); border:1px solid var(--blue); background:transparent; color:var(--blue);
    transition:background-color .15s var(--ease), color .15s var(--ease), transform .12s var(--ease); }
  .acts button:hover { background:rgba(10,111,216,.06); }
  .acts button:active { transform:scale(.98); }
  .acts button.pri { background:var(--blue); color:#fff; }
  .acts button.pri:hover { background:var(--blue-d); border-color:var(--blue-d); }
  .acts button:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  .acts button:disabled { cursor:progress; }
  .acts button .spin { width:16px; height:16px; box-sizing:border-box; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; }
  .acts button .spin.dk { border-color:rgba(10,111,216,.2); border-top-color:var(--blue); }
  @keyframes sp { to { transform:rotate(360deg); } }
  #prep { margin-top:16px; font-size:13px; color:var(--sec); min-height:20px; display:flex; justify-content:center; align-items:center; gap:8px; }
  #prep[style*="hidden"] { display:none; }
  #prep i { width:7px; height:7px; border-radius:50%; background:#c7c7cc; animation:pp 1s ease-in-out infinite alternate; }
  #prep.ok i { background:var(--ok); animation:none; }
  @keyframes pp { to { opacity:.35; } }
  .stage { width:100%; max-width:1180px; margin:56px auto 0; flex:1; display:flex; align-items:flex-end; }
  .stage video { display:block; width:100%; height:auto; aspect-ratio:3/2; object-fit:cover; border-radius:28px 28px 0 0; background:#e9edf1; }

  #err { margin:12px auto 0; color:#dc2626; font-size:13px; } #err:empty { display:none; }
  #prep { display:none !important; }

  @media (max-width:900px) {
    h1 { font-size:56px; } .sub { font-size:22px; }
  }
  @media (max-width:640px) {
    .hero { padding-top:max(56px,calc(env(safe-area-inset-top) + 32px)); padding-left:20px; padding-right:20px; }
    h1 { font-size:min(44px,10.4vw); } .sub { font-size:19px; }
    .acts { gap:12px; margin-top:24px; }
    .acts button { min-width:0; flex:0 1 auto; height:44px; padding:0 20px; font-size:16px; }
    .stage { width:calc(100% + 40px); margin:40px -20px 0; }
    .stage { align-items:stretch; min-height:300px; }
    .stage video { border-radius:0; aspect-ratio:auto; height:auto; object-position:45% 50%; }
  }
  @media (prefers-reduced-motion:reduce) { .hero > * { animation:none; } }
</style>
</head>
<body>
<div id="land">
  <section class="hero">
    <div class="org"><img src="mwa_logo.png" alt="" width="24" height="24">การประปานครหลวง</div>
    <h1>Stakeholder Day</h1>
    <p class="sub">ชั้น 5 อาคารสุทธิอุทกากร</p>
    <div class="acts">
      <button class="pri" id="goMap">เริ่มนำเสนอ</button>
      <button id="goF5">ไปชั้น 5</button>
    </div>
    <div id="prep" hidden></div><div id="err"></div>
    <div class="stage"><video id="heroVid" muted playsinline loop preload="auto" poster="stakeholder_hero.jpg" aria-label="ภาพมุมสูงชั้น 5 จากโมเดล 3 มิติ: บูธ ทางเดิน และห้อง Auditorium"></video></div>
  </section>
</div>

<script src="stakeholder_ui.js" defer></script>
<script src="stakeholder_building.js" defer></script>
<script src="stakeholder3d.js" defer></script>
<script type="module">
  const err = document.getElementById('err'), prepEl = document.getElementById('prep');
  // โหลดฉากชั้น 5 กับฟอนต์คู่กันเบื้องหลัง — ปุ่มกดได้ทันทีไม่ต้องรอ
  const f5mod = import('./stakeholder_floor5.js').catch(e => { err.textContent = 'โหลดฉากชั้น 5 ไม่สำเร็จ: ' + e.message; });
  const fonts = Promise.all(['700 40px "Bai Jamjuree"', '600 40px "Bai Jamjuree"', '500 40px "Bai Jamjuree"', '500 40px "IBM Plex Sans Thai"', '600 40px "IBM Plex Sans Thai"'].map(f => document.fonts.load(f, 'กขค Ab'))).catch(() => {});
  const fontsMax = Promise.race([fonts, new Promise(r => setTimeout(r, 2500))]);   // เน็ตช้า: ไม่รอฟอนต์เกิน 2.5 วิ

  const HQ = {
    name: 'การประปานครหลวง สำนักงานใหญ่',
    lat: 13.88052289121317, lon: 100.55175371285173,
    // อาคารสุทธิอุทกากร: ขนาดกรอบจากรอยอาคาร OSM/Overture · ตำแหน่งฐานตึกเลื่อนลงใต้ 15 ม. ตามภาพดาวเทียม (รอยเดิมเป็นหลังคาที่เอียงตามมุมกล้อง)
    // 50.7 (ตอ.–ตต.) × 70.8 (เหนือ–ใต้) ม. · แกนยาวเอียง 12.7° ไปทางตะวันออกของทิศเหนือ
    hq: { cx: -1.31, cz: 5.75, W: 50.7, D: 70.8, rot: -0.2215, bearing: 68, zoom: (innerHeight > innerWidth * 1.15 ? 18.3 : 19.0) },
    // ซ่อนรอยอาคาร OSM ที่โมเดลแทนที่แล้ว (หอ/ฐาน/อาคารโค้ง/ใต้สะพาน/อาคารเดิม) และรอยที่ตรวจจับผิด (เงาตึกริมคลอง)
    bld: { '-997': { hide: true }, '-998': { hide: true }, '-1000': { hide: true }, '-1001': { hide: true }, '-1002': { hide: true }, '-989': { hide: true }, '-990': { hide: true }, '-991': { hide: true }, '-992': { hide: true }, 152042395: { hide: true }, '-1006': { hide: true }, '-1007': { hide: true }, '-993': { hide: true } },   // 152042395 = หลังคาถังเก็บน้ำใส (จำลองเองแล้ว)
    // โรงงานผลิตน้ำบางเขน/สนามกีฬา/คลองประปา จำลองเองแล้ว → ซ่อนรอยอาคาร Overture และต้นไม้สุ่มในพื้นที่นั้น
    ovtHide: window.SUTHI.siteHide(), treeHide: window.SUTHI.siteHide(),
    hideR: 30, fixed: true, yaw: 0, note: 'Stakeholder Day', cityFile: 'SP01.json',
  };
  const land = document.getElementById('land');
  // ภาพหน้าแรกเคลื่อนไหวช้า ๆ (วิดีโอวนลูปจากโมเดลจริง) · จอเล็กใช้ไฟล์เล็ก · ปิดเมื่อผู้ใช้ตั้งค่าลดการเคลื่อนไหว หรือเมื่อเข้าฉากแล้ว
  const vid = document.getElementById('heroVid'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  { const small = innerWidth < 760; vid.poster = small ? 'stakeholder_hero_s.jpg' : 'stakeholder_hero.jpg'; if (!still) { vid.autoplay = true; vid.src = small ? 'stakeholder_hero_s.mp4' : 'stakeholder_hero.mp4'; vid.play().catch(() => {}); } }
  const show = on => { land.classList.toggle('off', !on); if (!still && vid.src) { if (on) vid.play().catch(() => {}); else vid.pause(); } };
  let watch = null;
  function watchBack() { clearInterval(watch); watch = setInterval(() => { const mapOn = window.SD3D && window.SD3D.isOpen(), f5On = window.MWA_FLOOR5 && window.MWA_FLOOR5.isOn(); if (!mapOn && !f5On) { clearInterval(watch); show(true); if (MOBILE) prepP = null; } }, 800); }
  let busy = false;
  const LITE = new URLSearchParams(location.search).has('lite');
  const frame2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const MOBILE = (() => { try { return (matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 1100) || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); } catch (e) { return false; } })();
  const bMap = document.getElementById('goMap'), bF5 = document.getElementById('goF5'), bMapHTML = bMap.innerHTML, bF5HTML = bF5.innerHTML;
  function setStatus(txt, ok) { prepEl.style.visibility = ''; prepEl.classList.toggle('ok', !!ok); prepEl.innerHTML = '<i></i>' + txt; }

  // เตรียมฉากชั้น 5 ล่วงหน้า (สร้างโมเดล + คอมไพล์ shader แบบไม่บล็อกหน้าเว็บ) → บินเข้าต่อเนื่องไม่สะดุด
  let prepP = null;
  function prepNow() {
    if (prepP) return prepP;
    prepP = Promise.all([f5mod, fontsMax]).then(frame2).then(() => { try { return window.MWA_FLOOR5 && window.MWA_FLOOR5.prepare && window.MWA_FLOOR5.prepare({}); } catch (e) {} })
      .then(() => { setStatus('พร้อมนำเสนอ', true); try { window.SD3D.preload(HQ.cityFile); } catch (e) {} });
    return prepP;
  }
  async function goMap() {
    if (busy) return; busy = true;
    if (MOBILE && !prepP) {   // มือถือ: เตรียมฉากก่อนเข้าแผนที่ (มีวงหมุนบอกสถานะ) → ระหว่างบินและเข้าชั้น 5 ไม่สะดุด
      bMap.innerHTML = '<span class="spin"></span>กำลังเตรียม'; bMap.disabled = bF5.disabled = true; setStatus('ครั้งแรกใช้เวลาสักครู่');
      await prepNow(); bMap.innerHTML = bMapHTML; bMap.disabled = bF5.disabled = false;
    }
    await fontsMax; show(false); window.SD3D.open(HQ); watchBack(); busy = false; prepNow();
  }
  async function goF5() {
    if (busy) return; busy = true; setStatus('กำลังเปิดชั้น 5'); bF5.innerHTML = '<span class="spin dk"></span>กำลังเปิด';
    await Promise.all([f5mod, fontsMax]); await frame2();
    if (window.MWA_FLOOR5) window.MWA_FLOOR5.play(Object.assign({ onDone: () => {} }, LITE ? { ao: false, dpr: 1 } : {}));
    show(false); watchBack(); busy = false; bF5.innerHTML = bF5HTML; setStatus('พร้อมนำเสนอ', true);
  }
  bMap.onclick = goMap; bF5.onclick = goF5;
  const q = new URLSearchParams(location.search);
  // มือถือ: เข้าชั้น 5 แล้วปิดแผนที่ที่อยู่ด้านหลัง (คืนหน่วยความจำ ~ไม่ให้ iOS ปิดหน้าเว็บ) · กดกลับจากชั้น 5 → หน้าแรก
  if (MOBILE) setInterval(() => { const f5 = window.MWA_FLOOR5 && window.MWA_FLOOR5.isOn(), mp = window.SD3D && window.SD3D.isOpen();
    if (f5 && mp) { window.__f5since = window.__f5since || performance.now(); if (performance.now() - window.__f5since > 1500) { try { window.SD3D.release(); } catch (e) {} } } else window.__f5since = 0; }, 500);
  if (MOBILE) { prepEl.style.visibility = 'hidden'; f5mod.then(() => { try { window.SD3D.preload(HQ.cityFile); } catch (e) {} }); }
  if (q.has('floor5')) goF5(); else if (q.has('go')) { goMap(); } else if (!MOBILE) setTimeout(() => window.requestIdleCallback ? requestIdleCallback(prepNow, { timeout: 1200 }) : prepNow(), 250);
  f5mod.then(() => fonts).then(() => { window.F5READY = true; });
</script>
</body>
</html>
